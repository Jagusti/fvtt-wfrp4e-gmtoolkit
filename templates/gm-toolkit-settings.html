<div>

  {{#each settings as |setting s|}}
  <div class="form-group">
      <label class="gmtoolkit settings label">{{localize setting.name}}</label>
      <div class="form-fields">
          
          {{#if setting.choices}}
          <select name="{{setting.key}}">
              {{#selectOptions choices selected=value localize=true}}
                {{#each setting.choices as |name k|}}
                <option value="{{k}}">{{localize name}}</option>
                {{/each}}
              {{/selectOptions}}
          </select>
  
          {{else if setting.boolean}}
          <input type="checkbox" name="{{setting.key}}" data-dtype="Boolean"  value="{{value}}" {{checked setting.value}}/>
          
          {{else if setting.isRange}}
            <button data-action="subtract" type="button" data-name="{{ setting.key}}">-</button>
            <input type="number" 
              name="{{ setting.key }}" 
              value="{{ setting.value }}" 
              min="{{ setting.range.min }}" 
              max="{{ setting.range.max }}" 
              step="{{ setting.range.step }}"/>
            <button data-action="add" type="button" data-name="{{ setting.key}}">+</button>
          
          {{else if setting.isNumber}}
          <input type="number" name="{{setting.key}}" data-dtype="Number" value="{{setting.value}}" step="{{setting.step}}"/>
  
          {{else if setting.filePicker}}
          {{filePicker target=setting.key type=setting.filePickerType}}
          <input type="text" name="{{setting.key}}" value="{{setting.value}}" data-dtype="{{setting.type}}"/>
  
          {{else}}
          <input type="text" name="{{setting.key}}" value="{{setting.value}}" data-dtype="{{setting.type}}"/>
          {{/if}}
      
      </div>
  </div>
  <p class="gmtoolkit settings notes">{{localize hint}}</p>
  {{/each}}

</div>
